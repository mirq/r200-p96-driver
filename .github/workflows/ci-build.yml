name: Radeon9200 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Match the pinned toolchain used for release artifacts. Newer images do
    # not provide the freestanding memcpy/memset runtime used by this driver.
    container: stefanreinauer/amiga-gcc:gcc-v6.5.0b-20251124@sha256:11b06254ed512d9a8f65fb13eeb723d5e33cacc1880b80df9f63c29e95fc879a

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Verify toolchain
        run: |
          m68k-amigaos-gcc --version | head -1
          m68k-amigaos-strip --version | head -1

      - name: Build release driver
        run: make clean && make
        env:
          CROSS: m68k-amigaos-

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp Radeon9200.chip dist/Radeon9200.chip
          cp Prometheus.card dist/Prometheus.card
          cp R200_MICROCODE_LICENSE.txt dist/R200_MICROCODE_LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt

      - name: Build debug driver
        run: make clean && make DEBUG=1
        env:
          CROSS: m68k-amigaos-

      - name: Stage debug artifact
        run: cp Radeon9200-debug.chip dist/Radeon9200-debug.chip

      - name: Build tools
        run: make clean && make tools
        env:
          CROSS: m68k-amigaos-

      - name: Stage tools
        run: cp build/p96screen dist/p96screen

      - name: List artifacts
        run: ls -la dist

      - name: Archive CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radeon9200-build-artifacts
          path: |
            dist/Radeon9200.chip
            dist/Prometheus.card
            dist/Radeon9200-debug.chip
            dist/p96screen
            dist/R200_MICROCODE_LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
