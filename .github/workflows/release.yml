name: Radeon9200 Release

on:
  push:
    tags:
      - "release_*"
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v6.5.0b-20251124@sha256:11b06254ed512d9a8f65fb13eeb723d5e33cacc1880b80df9f63c29e95fc879a

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Verify release tag metadata
        if: startsWith(github.ref_name, 'v')
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          grep -Fx "# Radeon9200 Prometheus integration $version" RELEASE_NOTES.md
          grep -Eq 'Radeon9200\.chip [0-9]+\.[0-9]+ \(' src/library.c
          grep -F 'Prometheus.card 7.602 ' Prometheus/PrometheusCard/vbcc_libinit.c

      - name: Verify toolchain
        run: |
          m68k-amigaos-gcc --version | head -1
          m68k-amigaos-strip --version | head -1

      - name: Build release driver
        run: make clean && make
        env:
          CROSS: m68k-amigaos-

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp Radeon9200.chip dist/Radeon9200.chip
          cp Prometheus.card dist/Prometheus.card
          cp R200_MICROCODE_LICENSE.txt dist/R200_MICROCODE_LICENSE.txt
          cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt

      - name: List artifacts
        run: ls -la dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/Radeon9200.chip
            dist/Prometheus.card
            dist/R200_MICROCODE_LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  release:
    name: Create GitHub Draft Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (required by gh-release)
        uses: actions/checkout@v4

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create release (draft for release_*, published for v*)
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ !startsWith(github.ref_name, 'v') }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/Radeon9200.chip
            artifacts/Prometheus.card
            artifacts/R200_MICROCODE_LICENSE.txt
            artifacts/THIRD_PARTY_NOTICES.txt
