name: Radeon9200 Release

on:
  push:
    tags:
      - "release_*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Verify toolchain
        run: |
          m68k-amigaos-gcc --version | head -1
          m68k-amigaos-strip --version | head -1

      - name: Build release driver
        run: make clean && make
        env:
          CROSS: m68k-amigaos-

      - name: Stage release artifact
        run: |
          mkdir -p dist
          cp Radeon9200.card dist/Radeon9200.card

      - name: Build debug driver
        run: make clean && make DEBUG=1
        env:
          CROSS: m68k-amigaos-

      - name: Stage debug artifact
        run: cp Radeon9200.card dist/Radeon9200-debug.card

      - name: Build tools
        run: make clean && make tools
        env:
          CROSS: m68k-amigaos-

      - name: Stage tools
        run: cp build/p96screen dist/p96screen

      - name: List artifacts
        run: ls -la dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/Radeon9200.card
            dist/Radeon9200-debug.card
            dist/p96screen
          if-no-files-found: error

  release:
    name: Create GitHub Draft Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout (required by gh-release)
        uses: actions/checkout@v4

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Create release (draft for release_*, published for v*)
        uses: softprops/action-gh-release@v1
        with:
          draft: ${{ !startsWith(github.ref_name, 'v') }}
          files: |
            artifacts/Radeon9200.card
            artifacts/Radeon9200-debug.card
            artifacts/p96screen